url: https://lhdjung.github.io/roundwork/
lang: en
home:
  title: Rounding for error detection
  description: |
    Flexible rounding procedures for error detection.
template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    link-color: '#ca225e'
    code-color: '#ca225e'
pkgdown:
  as_is: yes
articles:
- title: Quick guides
  navbar: Quick guides
  contents:
  - rounding-options
  - scrutiny
- title: Deep dive
  navbar: Deep dive
  contents:
  - rounding-in-depth
reference:
  - title: Main API
    desc: >
      Reconstruct rounded numbers, or the bounds of the numbers behind them.
  - contents:
    - reround
    - unround
  - title: Individual rounding procedures
    desc: >
      Each of these can also be reached through `reround()`'s `rounding`
      argument.
  - contents:
    - round_up
    - round_ties_up
    - round_ceiling
    - round_ties_to_even
  - title: Fractions and bias
  - contents:
    - reround_to_fraction
    - rounding_bias
  - title: For package developers
    desc: >
      The exact-integer form of `unround()`'s bounds, for building consistency
      tests on.
  - contents:
    - bound_numerators
